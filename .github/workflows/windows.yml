name: Windows build and tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Helios.Launcher/Helios.Launcher.csproj -c Release -p:Platform=x64
      - run: dotnet test tests/Helios.Library.Tests/Helios.Library.Tests.csproj -c Release -p:Platform=x64
